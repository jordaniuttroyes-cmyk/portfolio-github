<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#0a0a0a"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
  </defs>
  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="rgba(184,151,58,0.1)" stroke-width="1"/>
  <!-- Gold accent line -->
  <rect x="0" y="0" width="800" height="4" fill="#b8973a"/>
  <!-- Nav mockup -->
  <rect x="0" y="0" width="800" height="60" fill="rgba(0,0,0,0.7)"/>
  <circle cx="50" cy="30" r="16" fill="none" stroke="#b8973a" stroke-width="1.5"/>
  <text x="50" y="35" text-anchor="middle" font-family="serif" font-size="13" fill="#b8973a">G</text>
  <text x="140" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">ACCUEIL</text>
  <text x="240" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">DONNÉES</text>
  <text x="350" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">GALERIE</text>
  <text x="450" y="34" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">CONTACT</text>
  <!-- Hero text -->
  <text x="400" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" opacity="0.95">La</text>
  <text x="400" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-style="italic" fill="#b8973a">Gimsothèque</text>
  <!-- Subtitle -->
  <text x="400" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="4">SITE DÉDIÉ À GIMS — SAÉ 105 — BUT MMI</text>
  <!-- Bottom bar mockup -->
  <rect x="0" y="550" width="800" height="50" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(184,151,58,0.6)" letter-spacing="2">© Jordan Culot — IUT MMI Troyes</text>
</svg>
